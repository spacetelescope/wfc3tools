[project]
name = "wfc3tools"
description = "Python Tools for HST WFC3 Data"
requires-python = ">=3.11"
authors = [
    { name = "STScI" },
]
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "astropy",
    "numpy",
    "matplotlib",
    "stsci.tools",
    "scipy",
]
dynamic = [
    "version",
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "http://wfc3tools.readthedocs.io/"
"Bug Reports" = "https://github.com/spacetelescope/wfc3tools/issues/"
Source = "https://github.com/spacetelescope/wfc3tools/"
Help = "https://hsthelp.stsci.edu"

[project.optional-dependencies]
test = [
    "pytest",
    "ci-watson",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "sphinx-rtd-theme",
    "numpydoc",
]

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools_scm]
version_file = "wfc3tools/version.py"
